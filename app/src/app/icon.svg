<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c8cf0"/>
      <stop offset="100%" stop-color="#5d6de0"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <g transform="translate(50 52)">
    <!-- Closed book silhouette -->
    <rect x="-24" y="-28" width="48" height="56" rx="3" fill="url(#book)"/>
    <rect x="-24" y="-28" width="48" height="56" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    <!-- Book spine highlight -->
    <rect x="-24" y="-28" width="4" height="56" rx="1" fill="#ffffff" fill-opacity="0.18"/>
    <!-- Cross on book cover -->
    <rect x="-2" y="-16" width="4" height="24" rx="1" fill="#ffffff" fill-opacity="0.92"/>
    <rect x="-9" y="-9" width="18" height="4" rx="1" fill="#ffffff" fill-opacity="0.92"/>
    <!-- Page edge -->
    <rect x="-24" y="26" width="48" height="2" fill="#ffffff" fill-opacity="0.1"/>
  </g>
</svg>
